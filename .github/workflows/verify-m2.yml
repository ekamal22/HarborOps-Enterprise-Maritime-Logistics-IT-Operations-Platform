name: Verify M2
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-m2.yml
      - src/**
      - tests/**
      - web/**
      - docker/**
      - compose.yaml
      - docs/**
      - scripts/**
      - README.md
permissions:
  contents: read
concurrency:
  group: verify-m2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HARBOROPS_DB_PASSWORD: disposable-m2-check-only
      HARBOROPS_TEST_DB: "Host=127.0.0.1;Port=5432;Database=harborops_integration;Username=harborops"
      COMPOSE_PROJECT_NAME: ho-verify
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.verification/playwright-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify source revision and synthetic secret
        shell: bash
        run: |
          set -euo pipefail
          echo "HARBOROPS_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "HARBOROPS_TEST_USER_PASSWORD=$secret" >> "$GITHUB_ENV"
          mkdir -p .verification
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build hardened PostgreSQL
        run: docker build --build-arg SOURCE_REVISION="$HARBOROPS_SOURCE_SHA" -f docker/postgres/Dockerfile -t harborops-postgres:16.15-rootless .
      - name: Start fresh PostgreSQL for integration
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name harborops-m2-ci-db \
            --tmpfs /var/lib/postgresql/data:uid=70,gid=70,mode=0700 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e POSTGRES_DB=harborops_integration -e POSTGRES_USER=harborops \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:5432:5432 harborops-postgres:16.15-rootless
          for i in $(seq 1 45); do
            if docker exec harborops-m2-ci-db pg_isready -U harborops -d harborops_integration; then exit 0; fi
            sleep 2
          done
          docker logs harborops-m2-ci-db
          exit 1
      - name: Build .NET solution
        run: |
          dotnet restore HarborOps.sln
          dotnet build HarborOps.sln -c Release --no-restore
      - name: Inspect applied schema and M2 organization constraints
        run: |
          set -euo pipefail
          dotnet --info | head -n 40
          test -f src/HarborOps.Infrastructure/Persistence/Migrations/20261031020000_OrganizationMemberships.cs
      - name: Unit tests
        run: dotnet test tests/HarborOps.UnitTests/HarborOps.UnitTests.csproj -c Release --no-build
      - name: API contract tests
        run: dotnet test tests/HarborOps.ContractTests/HarborOps.ContractTests.csproj -c Release --no-build
      - name: Fresh PostgreSQL integration tests
        run: dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj -c Release --no-build
      - name: Seeded PostgreSQL repeat tests
        run: dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj -c Release --no-build
      - name: Frontend tests and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Planning document consistency
        run: |
          node scripts/render-execution-graph.mjs --check
          node scripts/check-planning-docs.mjs
      - name: Disposable Compose startup and M0 regression
        run: bash scripts/smoke-compose.sh --project ho-verify --confirm-disposable
      - name: Dependency outage/recovery regression
        run: bash scripts/check-m0-degraded.sh --project ho-verify --confirm-local-outage
      - name: Provision disposable browser account
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$HARBOROPS_TEST_USER_PASSWORD" | docker compose -p ho-verify run --rm -T \
            -e HARBOROPS_ALLOW_ACCOUNT_CLI=true api \
            --account-cli provision operator@example.test "Synthetic Operator"
      - name: Provision separate M2 browser identity
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$HARBOROPS_TEST_USER_PASSWORD" | docker compose -p ho-verify run --rm -T \
            -e HARBOROPS_ALLOW_ACCOUNT_CLI=true api \
            --account-cli provision m2-operator@example.test "M2 Synthetic Administrator"
      - name: Provision remaining synthetic G2 accounts
        shell: bash
        run: |
          set -euo pipefail
          for entry in \
            "m2-second-admin@example.test|Second Administrator" \
            "m2-outage@example.test|Outage Synthetic Member" \
            "m2-browser-chromium@example.test|Synthetic Browser Member" \
            "m2-browser-firefox@example.test|Synthetic Browser Member" \
            "m2-browser-webkit@example.test|Synthetic Browser Member"; do
            email=${entry%%|*}
            name=${entry#*|}
            printf '%s\n' "$HARBOROPS_TEST_USER_PASSWORD" | docker compose -p ho-verify run --rm -T \
              -e HARBOROPS_ALLOW_ACCOUNT_CLI=true api \
              --account-cli provision "$email" "$name"
          done
      - name: Bootstrap synthetic organization for M2 browser verification
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p ho-verify run --rm -T \
            -e HARBOROPS_ALLOW_ORGANIZATION_CLI=true api \
            --organization-cli bootstrap north-terminal "North Terminal" m2-operator@example.test
      - name: Bootstrap second isolated browser organization
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p ho-verify run --rm -T \
            -e HARBOROPS_ALLOW_ORGANIZATION_CLI=true api \
            --organization-cli bootstrap east-terminal "East Terminal" m2-second-admin@example.test
      - name: Deny non-opt-in and invalid organization bootstrap
        shell: bash
        run: |
          set -euo pipefail
          expect_failure() {
            if "$@" > /dev/null 2>&1; then
              echo "An intentionally invalid organization operation succeeded" >&2
              exit 1
            fi
          }
          expect_failure docker compose -p ho-verify run --rm -T api \
            --organization-cli bootstrap unauthorized-terminal "Unapproved" m2-second-admin@example.test
          expect_failure docker compose -p ho-verify run --rm -T \
            -e HARBOROPS_ALLOW_ORGANIZATION_CLI=true api \
            --organization-cli bootstrap unknown-terminal "Unknown" unknown-account@example.test
          expect_failure docker compose -p ho-verify run --rm -T \
            -e HARBOROPS_ALLOW_ORGANIZATION_CLI=true api \
            --organization-cli bootstrap north-terminal "Duplicate" m2-operator@example.test
          count=$(docker compose -p ho-verify exec -T postgres psql -U harborops -d harborops -Atc \
            "SELECT count(*) FROM organizations WHERE slug IN ('unauthorized-terminal', 'unknown-terminal')")
          test "$count" = "0"
          echo "G2 restricted CLI denial and atomic bootstrap: PASS"
      - name: Persistent session restart, outage and replay
        shell: bash
        run: bash scripts/check-m1-session-recovery.sh --project ho-verify --confirm-local-outage
      - name: Install locked Playwright and three browser engines
        working-directory: tests/browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser M0, M1 and M2 functional tests
        working-directory: tests/browser
        run: npm test
      - name: Authenticated organization outage recovery and durable revocation
        run: node scripts/check-m2-scoped-recovery.mjs
      - name: Scan revision-labeled running images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .verification/trivy
          for service in postgres api web; do
            container=$(docker compose -p ho-verify ps -q "$service")
            test -n "$container"
            image=$(docker inspect --format '{{.Image}}' "$container")
            revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
            test "$revision" = "$HARBOROPS_SOURCE_SHA"
            docker run --rm --pull always \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.verification/trivy:/root/.cache/trivy" \
              -v "$PWD/.verification:/reports" \
              aquasec/trivy:0.76.1 image --image-src docker \
              --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
              --format json --output "/reports/$service.json" "$image"
          done
      - name: Record diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p .verification
          git rev-parse HEAD > .verification/source-sha.txt
          docker compose -p ho-verify ps > .verification/compose-ps.txt 2>&1 || true
          docker compose -p ho-verify logs --no-color > .verification/compose.log 2>&1 || true
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-verification-${{ github.run_id }}
          path: |
            .verification/
            tests/browser/test-results/
          retention-days: 7
      - name: Remove disposable runner resources
        if: always()
        run: |
          docker compose -p ho-verify down --volumes --remove-orphans || true
          docker rm -f harborops-m2-ci-db || true
