name: Verify combined source with runner tools
on:
  push:
    branches:
      - feat/m11-m12-combined-integration
    paths:
      - .github/workflows/verify-m11-m12-startup.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify runner tools and source
        run: |
          set -euo pipefail
          echo "Requested source $GITHUB_SHA"
          command -v git
          command -v node
          node --version
          command -v dotnet || true
          dotnet --version || true
          git clone --depth=1 --branch feat/m11-m12-combined-integration "https://github.com/$GITHUB_REPOSITORY.git" source
          cd source
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/check-m11-contract.mjs
