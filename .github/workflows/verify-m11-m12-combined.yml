  dependency-security:
    name: Source-locked dependency advisory and committed-secret inventory
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture advisory inventories and enforce high-severity clean result
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .verification/dependency-security
          dotnet restore HarborOps.sln > .verification/dependency-security/restore.log 2>&1
          dotnet list HarborOps.sln package --vulnerable --include-transitive \
            > .verification/dependency-security/dotnet-advisories.txt 2>&1
          (cd web && npm ci --ignore-scripts --no-audit) \
            > .verification/dependency-security/npm-ci.log 2>&1
          (cd web && npm audit --audit-level=high --json) \
            > .verification/dependency-security/npm-audit.json || \
            echo npm_audit_nonzero > .verification/dependency-security/npm-audit-exit.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(".verification/dependency-security")
          data = json.loads((root/"npm-audit.json").read_text())
          audit_error = data.get("error")
          metadata = data.get("metadata",{}).get("vulnerabilities",{})
          high = int(metadata.get("high",0))
          critical = int(metadata.get("critical",0))
          if audit_error or high or critical:
              raise SystemExit(f"High-severity npm advisories or scan error: high={high} critical={critical} error={bool(audit_error)}")
          dotnet = (root/"dotnet-advisories.txt").read_text()
          import re
          if ("NU1903" in dotnet or "NU1904" in dotnet or
              any(re.search(r"\b(?:High|Critical)\b", line, re.I)
                  for line in dotnet.splitlines())):
              raise SystemExit("High or critical NuGet advisory reported")
          (root/"summary.json").write_text(json.dumps({
              "npm_high": high, "npm_critical": critical,
              "dotnet_high_advisories": 0, "scan_completed": True
          },indent=2)+"\n")
          PY
          if git grep -IlE 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----' \
            -- ':!*.lock' > .verification/dependency-security/possible-secret-paths.txt; then
            echo 'Potential committed credentials require review' >&2
            exit 1
          fi
      - name: Seal security evidence
        if: always()
        run: |
          mkdir -p .verification/dependency-security
          printf '%s\n' "$GITHUB_SHA" > .verification/dependency-security/source-sha.txt
          (cd .verification/dependency-security && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-${{ github.run_id }}
          path: .verification/dependency-security/
          retention-days: 30

