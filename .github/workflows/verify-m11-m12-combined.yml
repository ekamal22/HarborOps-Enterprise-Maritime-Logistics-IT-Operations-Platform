    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Execute source-locked accepted-milestone regressions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .verification/combined-regressions
          dotnet build HarborOps.sln -c Release -warnaserror \
            2>&1 | tee .verification/combined-regressions/build.log
          # M10 provisions server-global PostgreSQL role credentials.
          # Run its selected tests in their own process before the shared
          # regression suite so role changes cannot race with M11/M12 tests.
          dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj \
            -c Release --no-build \
            --filter 'FullyQualifiedName~M10RuntimeIdentityTests.StolenDatabaseSessionIdsCannotForgeAnM10Correction|FullyQualifiedName~M10RuntimeIdentityTests.M10HttpRoutesRunUnderTheRestrictedApiRoleWithManagerAndTenantGuards' \
            --logger 'console;verbosity=normal' \
