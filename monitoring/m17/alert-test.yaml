rule_files:
  - /etc/prometheus/alerts.yml
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      - series: 'harborops_request_duration_seconds_count{operation="business",status_class="2xx"}'
        values: '0+20x80'
      - series: 'harborops_request_failures_total{operation="business",status_class="5xx"}'
        values: '0+1x80'
    alert_rule_test:
      - eval_time: 7m
        alertname: HarborOpsElevatedApiFailureRate
        exp_alerts:
          - exp_labels: {severity: degraded}
            exp_annotations:
              summary: "Local API 5xx fraction above the approved reference trigger"
              remedy: "Below 0.5 percent for 5 minutes, with sufficient sample evidence"

  - interval: 15s
    input_series:
      - series: 'harborops_request_duration_seconds_count{operation="business",status_class="2xx"}'
        values: '0+20x80'
      - series: 'harborops_request_duration_seconds_bucket{le="1",operation="business",status_class="2xx"}'
        values: '0+0x80'
      - series: 'harborops_request_duration_seconds_bucket{le="2",operation="business",status_class="2xx"}'
        values: '0+20x80'
      - series: 'harborops_request_duration_seconds_bucket{le="+Inf",operation="business",status_class="2xx"}'
        values: '0+20x80'
    alert_rule_test:
      - eval_time: 7m
        alertname: HarborOpsHighApiP95
        exp_alerts:
          - exp_labels: {severity: degraded}
            exp_annotations:
              summary: "Local API p95 latency above one second"
              remedy: "Below 0.8 seconds for 10 minutes"

  - interval: 15s
    input_series:
      - series: 'harborops_db_readiness_ratio'
        values: '0x80'
      - series: 'harborops_db_readiness_sample_unix_seconds'
        values: '0+15x80'
    alert_rule_test:
      - eval_time: 2m
        alertname: HarborOpsDatabaseUnavailable
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Two consecutive recent PostgreSQL readiness samples failed"

  - interval: 15s
    input_series:
      - series: 'harborops_worker_backlog_age_seconds{worker="tracking"}'
        values: '150x16 40x64'
      - series: 'harborops_service_running_ratio{service="tracking"}'
        values: '1x80'
      - series: 'harborops_worker_heartbeat_total{worker="tracking"}'
        values: '0+1x80'
    alert_rule_test:
      - eval_time: 2m
        alertname: HarborOpsTrackingBacklogStale
        exp_alerts:
          - exp_labels: {worker: tracking, severity: degraded}
            exp_annotations:
              summary: "Eligible tracking work is stale in the explicitly enabled worker"
              remedy: "Below 60 seconds twice; held or disabled workers do not trigger"
      - eval_time: 4m
        alertname: HarborOpsTrackingBacklogStale
        exp_alerts:
          - exp_labels: {worker: tracking, severity: degraded}
            exp_annotations:
              summary: "Eligible tracking work is stale in the explicitly enabled worker"
              remedy: "Below 60 seconds twice; held or disabled workers do not trigger"
      - eval_time: 4m30s
        alertname: HarborOpsTrackingBacklogStale
        exp_alerts: []
      - eval_time: 5m
        alertname: HarborOpsTrackingBacklogStale
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'up{job="m17_collector"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 2m
        alertname: HarborOpsMonitoringMissing
        exp_alerts:
          - exp_labels: {severity: degraded}
            exp_annotations:
              summary: "Missing fresh application telemetry or collector scrape; business health is separate"

  - interval: 15s
    input_series:
      - series: 'otel_sdk_processor_span_processed_total{error_type="queue_full"}'
        values: '0+1x80'
    alert_rule_test:
      - eval_time: 2m
        alertname: HarborOpsExporterDrops
        exp_alerts:
          - exp_labels: {severity: informational}
            exp_annotations:
              summary: "OpenTelemetry batch queue full or OTLP exporter failed"

  - interval: 15s
    input_series:
      - series: 'harborops_request_duration_seconds_count{operation="other",status_class="4xx"}'
        values: '0+1x80'
      - series: 'harborops_request_failures_total{operation="other",status_class="5xx"}'
        values: '0x80'
      - series: 'harborops_service_running_ratio{service="tracking"}'
        values: '0x80'
      - series: 'harborops_worker_heartbeat_total{worker="tracking"}'
        values: '0+1x80'
      - series: 'harborops_worker_backlog_age_seconds{worker="tracking"}'
        values: '180x80'
    alert_rule_test:
      - eval_time: 7m
        alertname: HarborOpsElevatedApiFailureRate
        exp_alerts: []
      - eval_time: 2m
        alertname: HarborOpsTrackingBacklogStale
        exp_alerts: []

  # High failure rate falls to zero and clears after its five-minute hold.
  - interval: 15s
    input_series:
      - series: 'harborops_request_duration_seconds_count{operation="business",status_class="2xx"}'
        values: '0+20x120'
      - series: 'harborops_request_failures_total{operation="business",status_class="5xx"}'
        values: '0+2x20 40+0x100'
    alert_rule_test:
      - eval_time: 7m
        alertname: HarborOpsElevatedApiFailureRate
        exp_alerts:
          - exp_labels: {severity: degraded}
            exp_annotations:
              summary: "Local API 5xx fraction above the approved reference trigger"
              remedy: "Below 0.5 percent for 5 minutes, with sufficient sample evidence"
      - eval_time: 21m
        alertname: HarborOpsElevatedApiFailureRate
        exp_alerts: []

  # Latency recovers below the 0.8s clear threshold, then remains cleared.
  - interval: 15s
    input_series:
      - series: 'harborops_request_duration_seconds_count{operation="business",status_class="2xx"}'
        values: '0+20x140'
      - series: 'harborops_request_duration_seconds_bucket{le="0.5",operation="business",status_class="2xx"}'
        values: '0+0x40 0+20x100'
      - series: 'harborops_request_duration_seconds_bucket{le="1",operation="business",status_class="2xx"}'
        values: '0+0x40 0+20x100'
      - series: 'harborops_request_duration_seconds_bucket{le="2",operation="business",status_class="2xx"}'
        values: '0+20x140'
      - series: 'harborops_request_duration_seconds_bucket{le="+Inf",operation="business",status_class="2xx"}'
        values: '0+20x140'
    alert_rule_test:
      - eval_time: 7m
        alertname: HarborOpsHighApiP95
        exp_alerts:
          - exp_labels: {severity: degraded}
            exp_annotations:
              summary: "Local API p95 latency above one second"
              remedy: "Below 0.8 seconds for 10 minutes"
      - eval_time: 34m
        alertname: HarborOpsHighApiP95
        exp_alerts: []

  # Readiness must not remain critical after the health probe recovers.
  - interval: 15s
    input_series:
      - series: 'harborops_db_readiness_ratio'
        values: '0x20 1x40'
      - series: 'harborops_db_readiness_sample_unix_seconds'
        values: '0+15x60'
    alert_rule_test:
      - eval_time: 2m
        alertname: HarborOpsDatabaseUnavailable
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Two consecutive recent PostgreSQL readiness samples failed"
      - eval_time: 8m
        alertname: HarborOpsDatabaseUnavailable
        exp_alerts: []

  # No request data and a disabled worker must not be counted as healthy
  # high-volume traffic or trigger a phantom business alarm.
  - interval: 15s
    input_series:
      - series: 'harborops_request_duration_seconds_count{operation="other",status_class="4xx"}'
        values: '0x90'
      - series: 'harborops_request_failures_total{operation="other",status_class="5xx"}'
        values: '0x90'
      - series: 'harborops_service_running_ratio{service="tracking"}'
        values: '0x90'
      - series: 'harborops_worker_backlog_age_seconds{worker="tracking"}'
        values: '250x90'
      - series: 'harborops_worker_heartbeat_total{worker="tracking"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 12m
        alertname: HarborOpsElevatedApiFailureRate
        exp_alerts: []
      - eval_time: 12m
        alertname: HarborOpsHighApiP95
        exp_alerts: []
      - eval_time: 12m
        alertname: HarborOpsTrackingBacklogStale
        exp_alerts: []
