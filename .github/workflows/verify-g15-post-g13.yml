# The live notification fixture is confined to the disposable browser job.
# All other jobs and production defaults leave delivery disabled.
name: Verify G15 post G13 integration
run-name: G15 post G13 preflight and source-locked packet
on:
  push:
    branches:
      - integration/g15-post-g13-remediation-20261112
    paths:
      - .github/workflows/verify-g15-post-g13.yml
permissions:
  contents: read

jobs:
  source:
    name: Preflight source build contracts unit web
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source SHA
        run: |
          mkdir -p .verification
          git rev-parse HEAD | tee .verification/source-sha.txt
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Source and planning contracts
        run: |
          set -euo pipefail
          node scripts/check-m11-contract.mjs 2>&1 | tee .verification/m11-contract.log
          grep -Fq 'verify-g15-post-g13.yml' scripts/check-m15-contract.mjs
          node scripts/check-m15-contract.mjs 2>&1 | tee .verification/m15-contract.log
          node scripts/check-m13-csp.mjs 2>&1 | tee .verification/m13-csp.log
          grep -q 'libgssapi-krb5-2' src/HarborOps.Api/Dockerfile
          grep -Fq 'harborops.m15_test_slow_first_done' tests/HarborOps.IntegrationTests/G15RemediationAcceptanceTests.cs
          grep -Fq 'G15_SKIP_LOCKED_PROGRESS_FAILURE:' tests/HarborOps.IntegrationTests/G15RemediationAcceptanceTests.cs
          grep -Fq 'G15_SKIP_LOCKED_PROGRESS_FAILURE:' scripts/g15-mutation-campaign.py
          grep -Fq 'PopulatedG13SeventeenMigrationDatabaseAcceptsG15WithoutChangingAcceptedRows' tests/HarborOps.IntegrationTests/M11M12UpgradeTests.cs
          test -f docs/G13_POSTMERGE_RECONCILIATION_20261112.md
          python3 -m py_compile scripts/verify-g13-g15-evidence.py scripts/check-g13-g15-scenarios.py scripts/audit-g13-g15-assertions.py scripts/check-g13-g15-sensitive-evidence.py scripts/g13-g15-process-crash.py scripts/g13-mutation-campaign.py scripts/g15-mutation-campaign.py
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path
          inventory = json.loads(Path("docs/G13_G15_ASSERTION_INVENTORY_20261109.json").read_text())
          assertions = [a for group in inventory["scenarios"] for a in group["assertions"]]
          assert len(assertions) == 263, "Expected all 263 separate assertions"
          ids = [a["id"] for a in assertions]
          assert len(set(ids)) == len(ids), "Duplicate assertion ID"
          assert all(a["assessment"] == "FULLY_TESTED"
                     for a in assertions if a["kind"] == "automated"), (
              "Candidate evidence inventory still has an incomplete automated mapping")
          source = ast.parse(Path("scripts/g13-mutation-campaign.py").read_text())
          mutation_defs = [node.value for node in source.body
                           if isinstance(node, ast.Assign)
                           and any(isinstance(target, ast.Name) and target.id == "MUTANTS"
                                   for target in node.targets)]
          assert len(mutation_defs) == 1, "Mutation definition missing"
          mutations = ast.literal_eval(mutation_defs[0])
          assert len(mutations) == 45, "Expected 45 G13 source mutants"
          assert "member-sql-tenant-filter-silently-excludes-draft" in (
              item[0] for item in mutations), "Silent member-filter loss control missing"
          PY
          node scripts/render-execution-graph.mjs --check 2>&1 | tee .verification/graph.log
          find tests/browser/specs -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Reconcile historical documentation consistency
        run: |
          set -euo pipefail
          node scripts/check-planning-docs.mjs 2>&1 | tee .verification/planning.log
      - name: Build solution and execute unit contracts
        run: |
          set -euo pipefail
          dotnet restore HarborOps.sln 2>&1 | tee .verification/restore.log
          dotnet build HarborOps.sln --configuration Release --no-restore -warnaserror 2>&1 | tee .verification/build.log
          dotnet test tests/HarborOps.UnitTests/HarborOps.UnitTests.csproj --configuration Release --no-build --logger 'trx;LogFileName=unit.trx' --results-directory .verification 2>&1 | tee .verification/unit.log
          dotnet test tests/HarborOps.ContractTests/HarborOps.ContractTests.csproj --configuration Release --no-build --logger 'trx;LogFileName=contract.trx' --results-directory .verification 2>&1 | tee .verification/contract.log
      - name: Verify web build
        run: |
          set -euo pipefail
          npm --prefix web ci --no-audit --no-fund 2>&1 | tee .verification/npm.log
          npm --prefix web test 2>&1 | tee .verification/web-test.log
          npm --prefix web run build 2>&1 | tee .verification/web-build.log
      - name: Seal source evidence
        if: always()
        run: |
          git rev-parse HEAD > .verification/final-sha.txt
          (cd .verification && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-source-${{ github.run_id }}
          path: .verification/
          retention-days: 30
          include-hidden-files: true

  m15-database:
    name: Combined M13 M15 scoped PostgreSQL regressions
    runs-on: ubuntu-latest
    timeout-minutes: 85
    needs: source
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: harborops_integration
          POSTGRES_USER: harborops
          POSTGRES_PASSWORD: disposable-m15-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harborops -d harborops_integration"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HARBOROPS_TEST_DB: "Host=127.0.0.1;Port=5432;Database=harborops_integration;Username=harborops;Password=disposable-m15-postgres;Pooling=false"
      HARBOROPS_G13_EXCLUSIVE_POSTGRES: "1"
      HARBOROPS_G12_EXCLUSIVE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify source SHA
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build and execute fourteen ordered database filters
        run: |
          set -euo pipefail
          mkdir -p .verification/m15
          dotnet restore HarborOps.sln 2>&1 | tee .verification/m15/restore.log
          dotnet build HarborOps.sln -c Release --no-restore -warnaserror 2>&1 | tee .verification/m15/build.log
          while IFS=$'\t' read -r label filter; do
            test -n "$label" || continue
            dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj -c Release --no-build --filter "$filter" --logger 'console;verbosity=normal' --logger "trx;LogFileName=$label.trx" --results-directory .verification/m15 2>&1 | tee ".verification/m15/$label.log"
            test -s ".verification/m15/$label.trx"
          done <<'FILTERS'
          m15-integration	FullyQualifiedName~G13G15FeatureDefaultAcceptanceTests|FullyQualifiedName~M15NotificationRuntimeTests|FullyQualifiedName~M15FinalAuthorizationTests|FullyQualifiedName~M13OperationalKpiRuntimeTests|FullyQualifiedName~M13FaultRecoveryTests|FullyQualifiedName~M11ExceptionRuntimeTests|FullyQualifiedName~M11M12UpgradeTests|FullyQualifiedName~MigrationSnapshotTests|FullyQualifiedName~M10UpgradeTests
          g13-g15-revocation	FullyQualifiedName~G13G15RevocationAcceptanceTests
          g13-filter-acceptance	FullyQualifiedName~G13FilterAcceptanceTests
          g13-g15-truth-table	FullyQualifiedName~G15EventCatalogAcceptanceTests|FullyQualifiedName~G13EmptyDataAcceptanceTests
          g13-g15-restricted-sql	FullyQualifiedName~G13G15RestrictedSqlAcceptanceTests
          g15-final-behavior	FullyQualifiedName~G15AuditAcceptanceTests|FullyQualifiedName~G15HistoricalTargetAcceptanceTests
          g15-http-dependency-outage	FullyQualifiedName~G15HttpOutageAcceptanceTests
          g15-remediation	FullyQualifiedName~G15RemediationAcceptanceTests
          g13-tenant-capacity	FullyQualifiedName~M13TenantCapacityAcceptanceTests|FullyQualifiedName~M13AdmissionControlAcceptanceTests|FullyQualifiedName~M13SecurityEnvelopeAcceptanceTests|FullyQualifiedName~M15DowngradeGuardAcceptanceTests|FullyQualifiedName~G13G15RuntimeOptInAcceptanceTests
          g13-rate-limit	FullyQualifiedName~G13RateLimitAcceptanceTests
          g15-recurrence	FullyQualifiedName~G15RecurrenceAcceptanceTests
          g13-tracking-source	FullyQualifiedName~G13TrackingSourceAcceptanceTests
          g13-m11-source	FullyQualifiedName~G13M11SourceAcceptanceTests
          m15-boundaries	FullyQualifiedName~M15NotificationBoundaryTests
          FILTERS
      - name: Hash evidence and mark source
        if: always()
        run: |
          mkdir -p .verification/m15
          printf '%s\n' "$GITHUB_SHA" > .verification/m15/source-sha.txt
          (cd .verification/m15 && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
          echo "M15 PostgreSQL source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload M15 database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m15-database-${{ github.run_id }}
          path: .verification/m15/
          retention-days: 7
          include-hidden-files: true

  m15-browser:
    name: Combined three-engine KPI and notification UI
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: source
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disposable M15 browser fixtures and Chromium Firefox WebKit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          export HARBOROPS_SOURCE_SHA="$GITHUB_SHA"
          export HARBOROPS_DB_PASSWORD="$(openssl rand -hex 24)"
          export HARBOROPS_API_DB_PASSWORD="$(openssl rand -hex 24)"
          export HARBOROPS_WORKER_DB_PASSWORD="$(openssl rand -hex 24)"
          export HARBOROPS_M10_CORRECTION_PROOF_KEY="$(openssl rand -base64 32)"
          export HARBOROPS_M12_EXPORT_PROOF_KEY="$(openssl rand -base64 32)"
          export HARBOROPS_TEST_USER_PASSWORD="$(openssl rand -hex 22)"
          for key in HARBOROPS_DB_PASSWORD HARBOROPS_API_DB_PASSWORD HARBOROPS_WORKER_DB_PASSWORD HARBOROPS_M10_CORRECTION_PROOF_KEY HARBOROPS_M12_EXPORT_PROOF_KEY HARBOROPS_TEST_USER_PASSWORD; do
            echo "::add-mask::${!key}"
          done
          export HARBOROPS_BROWSER_BASE_URL="http://localhost:5173"
          export HARBOROPS_M5_FIXTURES=1
          export HARBOROPS_M12_FIXTURES=1
          export HARBOROPS_M13_FIXTURES=1
          # Enable only for this isolated, disposable browser integration stack.
          export HARBOROPS_M15_ENABLE_DELIVERY=true
          export HARBOROPS_M15_LIVE_FIXTURE=1
          export HARBOROPS_VERIFICATION_ROOT="$PWD/.verification"
          mkdir -p .verification/evidence .verification/m15-browser
          printf '%s\n' "$GITHUB_SHA" > .verification/m15-browser/source-sha.txt
          project="ho-verify-m15-${GITHUB_RUN_ID}"
          cleanup() {
            code=$?
            # Remove transient authentication state before any evidence upload.
            rm -f -- "$HARBOROPS_VERIFICATION_ROOT/.private/m15-manager.json" \
              "$HARBOROPS_VERIFICATION_ROOT/.private/m15-administrator.json"
            rmdir -- "$HARBOROPS_VERIFICATION_ROOT/.private" 2>/dev/null || true
            docker compose -p "$project" ps || true
            docker compose -p "$project" down --volumes --remove-orphans || true
            exit "$code"
          }
          trap cleanup EXIT
          bash scripts/smoke-compose.sh --project "$project" --confirm-disposable
          for entry in \
            "m3-admin-a@example.test|M3 North Administrator" \
            "m3-admin-b@example.test|M3 East Administrator" \
            "m3-manager@example.test|M3 Manager" \
            "m3-analyst@example.test|M3 Analyst" \
            "m4-analyst-east@example.test|M4 East Analyst" \
            "m4-support@example.test|M4 Support" \
            "m4-auditor@example.test|M4 Auditor"; do
            email="${entry%%|*}"
            title="${entry#*|}"
            printf '%s\n' "$HARBOROPS_TEST_USER_PASSWORD" |
              docker compose -p "$project" run --rm -T -e HARBOROPS_ALLOW_ACCOUNT_CLI=true api \
              --account-cli provision "$email" "$title"
          done
          for item in \
            "m3-north|M3 North Terminal|m3-admin-a@example.test" \
            "m3-east|M3 East Terminal|m3-admin-b@example.test" \
            "m3-pagination|M3 Pagination Fixtures|m3-admin-a@example.test" \
            "m3-revocation-chromium|M3 Revocation chromium|m3-admin-a@example.test" \
            "m3-revocation-firefox|M3 Revocation firefox|m3-admin-a@example.test" \
            "m3-revocation-webkit|M3 Revocation webkit|m3-admin-a@example.test"; do
            slug="${item%%|*}"
            rest="${item#*|}"
            title="${rest%%|*}"
            email="${rest#*|}"
            docker compose -p "$project" run --rm -T -e HARBOROPS_ALLOW_ORGANIZATION_CLI=true api \
              --organization-cli bootstrap "$slug" "$title" "$email"
          done
          node scripts/prepare-m3-browser-fixtures.mjs
          node scripts/prepare-m4-browser-fixtures.mjs
          node scripts/prepare-m5-browser-fixtures.mjs
          node scripts/prepare-m15-browser-fixtures.mjs
          test -s "$HARBOROPS_VERIFICATION_ROOT/.private/m15-manager.json"
          test -s "$HARBOROPS_VERIFICATION_ROOT/.private/m15-administrator.json"
          npm --prefix tests/browser ci --no-audit --no-fund
          (cd tests/browser && npx playwright install --with-deps chromium firefox webkit)
          for engine in chromium firefox webkit; do
            for suite in notifications operational-kpis; do
              # M15 and M13 use the same authenticated manager. Running both
              # suites inside a single limiter window exhausts the documented
              # six-report-per-minute policy. Reset only the disposable API
              # process between suites; retain all DB fixtures and policy.
              docker compose -p "$project" restart api
              # Wait for both the API and the browser's nginx reverse proxy
              # before refreshing sessions. Immediately requesting CSRF after
              # restart produced HTTP 502 while the API was still starting.
              ready=0
              for attempt in $(seq 1 45); do
                if curl --silent --fail --max-time 3 http://127.0.0.1:8080/health/ready >/dev/null &&
                   curl --silent --fail --max-time 3 http://127.0.0.1:5173/api/v1/auth/csrf >/dev/null; then
                  ready=1; break
                fi
                sleep 2
              done
              if [ "$ready" != "1" ]; then
                docker compose -p "$project" ps
                echo "Disposable API/browser proxy did not become ready after restart" >&2
                exit 1
              fi
              if [ "$suite" = notifications ]; then node scripts/prepare-m15-browser-fixtures.mjs --refresh-sessions-only; fi
              if [ "$suite" = operational-kpis ]; then docker compose -p "$project" exec -T postgres psql -U harborops -d harborops -tA -c "WITH d AS (DELETE FROM operational_kpi_reports RETURNING 1) SELECT count(*) FROM d" > ".verification/m15-browser/${engine}-report-reset.txt"; fi
              export HARBOROPS_G3_JSON_REPORT="$HARBOROPS_VERIFICATION_ROOT/m15-browser/${engine}-${suite}.json"
              (cd tests/browser && npx playwright test "specs/${suite}.spec.mjs" --project="$engine" --workers=1)
              HARBOROPS_EXPECTED_CASES="$([ "$suite" = notifications ] && echo 11 || echo 9)" \
                node -e 'const s=require(process.env.HARBOROPS_G3_JSON_REPORT).stats;const n=Number(process.env.HARBOROPS_EXPECTED_CASES);if(!s||s.expected!==n||s.skipped!==0||s.unexpected!==0)process.exit(2);console.log("Combined browser suite passed:",s.expected,"failed:",s.unexpected)'
            done
          done
      - name: Capture browser evidence hashes
        if: always()
        run: |
          mkdir -p .verification/m15-browser
          printf '%s\n' "$GITHUB_SHA" > .verification/m15-browser/source-sha.txt
          (cd .verification/m15-browser && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
          echo "M15 browser source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload M15 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m15-browser-${{ github.run_id }}
          path: .verification/m15-browser/
          retention-days: 7
          include-hidden-files: true


  scale:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 110
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: harborops_integration
          POSTGRES_USER: harborops
          POSTGRES_PASSWORD: disposable-g13-scale
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U harborops -d harborops_integration" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HARBOROPS_TEST_DB: 'Host=127.0.0.1;Port=5432;Database=harborops_integration;Username=harborops;Password=disposable-g13-scale;Pooling=false'
      HARBOROPS_G13_EXCLUSIVE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Measure reference and realistic 250k-bound workloads
        env:
          HARBOROPS_EVIDENCE_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .verification/g13-scale
          dotnet build HarborOps.sln -c Release -warnaserror 2>&1 | tee .verification/g13-scale/build.log
          dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj -c Release --no-build --filter 'FullyQualifiedName~M13ScaleLoadTests.Mixed85kShipmentsProduceExactBoundedReport' --logger 'console;verbosity=normal' --logger 'trx;LogFileName=scale-reference.trx' --results-directory .verification/g13-scale 2>&1 | tee .verification/g13-scale/scale-reference.log
          test -s .verification/g13-scale/scale-reference.trx
          pg="$(docker ps -q --filter ancestor=postgres:16.15)"
          test "$(printf '%s\n' "$pg" | grep -c .)" -eq 1
          docker exec "$pg" psql -v ON_ERROR_STOP=1 -U harborops -d postgres -c 'DROP DATABASE IF EXISTS harborops_integration WITH (FORCE)' -c 'CREATE DATABASE harborops_integration'
          python3 scripts/sample-g13-database-container.py --container "$pg" --output .verification/g13-scale/pg-resources -- dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj -c Release --no-build --filter 'FullyQualifiedName~M13ScaleLoadTests.RealisticSkewedTenantMeetsApprovedLatencyAndResourceBudgetsUnderTheRestrictedRole' --logger 'console;verbosity=normal' --logger 'trx;LogFileName=scale-realistic.trx' --results-directory .verification/g13-scale
          cp .verification/g13-scale/pg-resources/command.log .verification/g13-scale/scale-realistic.log
          test -s .verification/g13-scale/scale-realistic.trx
          test -s .verification/g13-scale/pg-resources/resource-summary.json
      - name: Save evidence checksums
        if: always()
        run: |
          mkdir -p .verification/g13-scale
          printf '%s\n' "$GITHUB_SHA" > .verification/g13-scale/source-sha.txt
          sha256sum tests/HarborOps.IntegrationTests/M13ScaleLoadTests.cs > .verification/g13-scale/test-sha256.txt
          (cd .verification/g13-scale && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
          find .verification/g13-scale -type f -print0 | sort -z | xargs -0 -r sha256sum >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g13-scale-${{ github.sha }}
          path: .verification/g13-scale
          if-no-files-found: warn
          retention-days: 30


  security-mutations:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: harborops_integration
          POSTGRES_USER: harborops
          POSTGRES_PASSWORD: disposable-g13-security
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U harborops -d harborops_integration" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HARBOROPS_TEST_DB: 'Host=127.0.0.1;Port=5432;Database=harborops_integration;Username=harborops;Password=disposable-g13-security;Pooling=false'
      HARBOROPS_G13_EXCLUSIVE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run clean SQL control and effective policy attacks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/g13-security-mutation-campaign.py
      - name: Verify source restoration and evidence hashes
        if: always()
        run: |
          mkdir -p .verification/g13-security-mutations
          test -z "$(git status --porcelain --untracked-files=no)"
          sha256sum scripts/g13-security-mutation-campaign.py > .verification/g13-security-mutations/runner-sha256.txt
          printf '%s\n' "$GITHUB_SHA" > .verification/g13-security-mutations/source-sha.txt
          (cd .verification/g13-security-mutations && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
          find .verification/g13-security-mutations -type f -print0 | sort -z | xargs -0 -r sha256sum >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g13-security-mutations-${{ github.sha }}
          path: .verification/g13-security-mutations
          retention-days: 14


  g13-faults:
    name: G13 transaction rollback and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: source
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: harborops_integration
          POSTGRES_USER: harborops
          POSTGRES_PASSWORD: disposable-g13-fault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harborops -d harborops_integration"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HARBOROPS_TEST_DB: "Host=127.0.0.1;Port=5432;Database=harborops_integration;Username=harborops;Password=disposable-g13-fault;Pooling=false"
      HARBOROPS_G13_EXCLUSIVE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Execute real PostgreSQL report fault recovery
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .verification/g13-faults
          dotnet build HarborOps.sln -c Release -warnaserror
          dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj \
            -c Release --no-build --filter 'FullyQualifiedName~M13FaultRecoveryTests' \
            --logger 'trx;LogFileName=g13-faults.trx' \
            --results-directory .verification/g13-faults
      - name: Seal fault evidence
        if: always()
        run: |
