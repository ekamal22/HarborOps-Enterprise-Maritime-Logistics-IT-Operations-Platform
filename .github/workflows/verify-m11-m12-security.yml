name: Verify combined M11 M12 security dependencies
on:
  push:
    branches:
      - feat/m11-m12-combined-integration
    paths:
      - .github/workflows/verify-m11-m12-security.yml
      - src/**
      - tests/**
      - web/**
      - scripts/**
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact source and scan advisories
        run: |
          set -euo pipefail
          git clone --branch feat/m11-m12-combined-integration "https://github.com/$GITHUB_REPOSITORY.git" source
          cd source
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e 6ead1d076946dd96b53401265a31efc35c4a666c^{commit}
          echo "Verification source: $GITHUB_SHA"
          echo "Node: $(node --version)"
          echo "dotnet: $(dotnet --version)"
          set +e
          dotnet restore HarborOps.sln
          restore_status=$?
          dotnet list HarborOps.sln package --vulnerable --include-transitive
          dotnet_status=$?
          npm --prefix web audit --audit-level=high --omit=dev
          web_status=$?
          npm --prefix tests/browser audit --audit-level=high --omit=dev
          browser_status=$?
          set -e
          printf 'Dependency scan status: restore=%d dotnet=%d web=%d browser=%d\n' "$restore_status" "$dotnet_status" "$web_status" "$browser_status" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$restore_status" -eq 0
          test "$dotnet_status" -eq 0
          test "$web_status" -eq 0
          test "$browser_status" -eq 0
      - name: Trivy source filesystem vulnerability scan
        run: |
          set -euo pipefail
          test -d source
          docker run --rm --pull=always -v "$PWD/source:/work:ro"             aquasec/trivy:0.76.1 fs --scanners vuln --severity HIGH,CRITICAL             --exit-code 1 --format table /work
          echo "Trivy source filesystem scan PASS for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
