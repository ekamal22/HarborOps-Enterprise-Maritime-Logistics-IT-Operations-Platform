name: Verify combined M11 M12 documentation consistency
on:
  push:
    branches:
      - feat/m11-m12-combined-integration
    paths:
      - .github/workflows/verify-m11-m12-docs.yml
      - docs/**
      - README.md
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact source and planning documents
        run: |
          set -euo pipefail
          git clone --branch feat/m11-m12-combined-integration "https://github.com/$GITHUB_REPOSITORY.git" source
          cd source
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e 6ead1d076946dd96b53401265a31efc35c4a666c^{commit}
          git diff --check 325b660f99a05145f7fdd436bf7ca96e95229a2f...HEAD
          node scripts/check-planning-docs.mjs
          node scripts/render-execution-graph.mjs --check
          node scripts/check-m11-contract.mjs
          echo "Documentation and source references validated at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
