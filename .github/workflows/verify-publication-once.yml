name: Publication Security Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harborops-publication-verification-r4-once
  cancel-in-progress: false

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HARBOROPS_DB_PASSWORD: disposable-publication-test-only
      HARBOROPS_TEST_DB: Host=127.0.0.1;Port=5432;Database=harborops_integration;Username=harborops
      COMPOSE_PROJECT_NAME: ho-verify-pub
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/work/_temp/harborops-publication-browsers
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Record candidate identity
        shell: bash
        run: |
          set -euo pipefail
          security_source="d9bc2aba875039bcd84b1212e023cb8cd9f4e319"
          git merge-base --is-ancestor "$security_source" HEAD
          unexpected=$(git diff --name-only "$security_source" HEAD | grep -Ev "^\.github/workflows/verify-publication-once\.yml$" || true)
          if [ -n "$unexpected" ]; then
            echo "Verification branch includes unexpected source changes" >&2
            exit 1
          fi
          echo "Verification commit: $(git rev-parse HEAD)"
          echo "Security source commit: $security_source"
          echo "HARBOROPS_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          credential="$(openssl rand -hex 32)"
          echo "::add-mask::$credential"
          echo "HARBOROPS_TEST_USER_PASSWORD=$credential" >> "$GITHUB_ENV"
          mkdir -p .verification

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate local review scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/audit-publication-history.py scripts/audit-publication-artifacts.py scripts/audit-publication-supply-chain.py scripts/prepare-public-source-snapshot.py scripts/check-publication-governance.py; do
            python -c 'import ast,sys;ast.parse(open(sys.argv[1],encoding="utf-8").read())' "$script"
          done
          node --check scripts/verify-publication-http.mjs
          node --check scripts/verify-publication-hosted.mjs

      - name: Build PostgreSQL test image
        run: docker build --build-arg SOURCE_REVISION="$HARBOROPS_SOURCE_SHA" -t harborops-postgres:16.15-rootless -f docker/postgres/Dockerfile .

      - name: Start disposable test database
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name harborops-publication-test-db \
            --tmpfs /var/lib/postgresql/data:uid=70,gid=70,mode=0700 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e POSTGRES_DB=harborops_integration -e POSTGRES_USER=harborops \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:5432:5432 harborops-postgres:16.15-rootless
          for n in $(seq 1 45); do
            if docker exec harborops-publication-test-db pg_isready -U harborops -d harborops_integration; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Restore and compile solution
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore HarborOps.sln
          dotnet build HarborOps.sln -c Release --no-restore

      - name: Unit and API contract regressions
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HarborOps.UnitTests/HarborOps.UnitTests.csproj -c Release --no-build
          dotnet test tests/HarborOps.ContractTests/HarborOps.ContractTests.csproj -c Release --no-build

      - name: PostgreSQL integration and authorization regressions
        run: dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj -c Release --no-build

      - name: Frontend tests and production build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix web --no-fund --no-audit
          npm test --prefix web
          npm run build --prefix web

      - name: Current package advisories
        shell: bash
        run: |
          set -euo pipefail
          dotnet list HarborOps.sln package --vulnerable --include-transitive --format json > .verification/dotnet-advisories.json
          python - <<'PY'
          import json
          packages=json.load(open('.verification/dotnet-advisories.json')).get('projects', [])
          if not packages: raise SystemExit('Missing NuGet audit inventory')
          issues=[p for project in packages for f in project.get('frameworks',[])
                  for key in ('topLevelPackages','transitivePackages')
                  for p in f.get(key,[]) if p.get('vulnerabilities')]
          print('NuGet reported vulnerable dependencies:',len(issues))
          if issues: raise SystemExit(1)
          PY
          npm audit --prefix web --audit-level=high --json > .verification/npm-web-advisories.json
          npm ci --prefix tests/browser --no-fund --no-audit
          npm audit --prefix tests/browser --audit-level=high --json > .verification/npm-browser-advisories.json

      - name: Build and smoke test disposable Compose stack
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/smoke-compose.sh --project ho-verify-pub --confirm-disposable
          docker compose -p ho-verify-pub exec -T web nginx -t
          node scripts/verify-publication-http.mjs

      - name: Provision isolated synthetic browser account
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$HARBOROPS_TEST_USER_PASSWORD" |
            docker compose -p ho-verify-pub run --rm -T -e HARBOROPS_ALLOW_ACCOUNT_CLI=true api \
              --account-cli provision operator@example.test "Synthetic Operator"

      - name: Three-engine browser authentication and baseline regressions
        shell: bash
        run: |
          set -euo pipefail
          cd tests/browser
          npx playwright install --with-deps chromium firefox webkit
          npx playwright test specs/auth.spec.mjs specs/baseline.spec.mjs specs/regression.spec.mjs --workers=1

      - name: Scan exact revision container images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .verification/trivy
          for service in postgres api web; do
            container=$(docker compose -p ho-verify-pub ps -q "$service")
            test -n "$container"
            image=$(docker inspect --format '{{.Image}}' "$container")
            revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
            test "$revision" = "$HARBOROPS_SOURCE_SHA"
            docker run --rm --pull always \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.verification/trivy:/root/.cache/trivy" \
              -v "$PWD/.verification:/reports" \
              aquasec/trivy:0.76.1 image --image-src docker --scanners vuln \
              --severity HIGH,CRITICAL --exit-code 1 \
              --format json --output "/reports/$service.json" "$image"
            echo "$service image vulnerability scan: PASS"
          done

      - name: Clean isolated verification resources
        if: always()
        shell: bash
        run: |
          docker compose -p ho-verify-pub down --volumes --remove-orphans || true
          docker rm -f harborops-publication-test-db || true
          # The Trivy container creates root-owned cache files on the mounted volume.
          # Limit privileged cleanup to this disposable checkout's known paths.
          sudo rm -rf -- tests/browser/test-results .verification
          test ! -e .verification
