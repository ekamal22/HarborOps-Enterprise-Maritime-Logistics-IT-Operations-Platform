name: Verify M11 M12 impacted regressions
on:
  push:
    branches:
      - feat/m11-m12-combined-integration
    paths:
      - .github/workflows/verify-m11-m12-impacted.yml
jobs:
  impacted:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: harborops_integration
          POSTGRES_USER: harborops
          POSTGRES_PASSWORD: disposable-impacted-regressions
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U harborops -d harborops_integration" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HARBOROPS_TEST_DB: "Host=127.0.0.1;Port=5432;Database=harborops_integration;Username=harborops;Password=disposable-impacted-regressions;Pooling=false"
      HARBOROPS_G12_EXCLUSIVE_POSTGRES: "1"
    steps:
      - name: Checkout source-locked candidate and build
        run: |
          set -euo pipefail
          git clone --branch feat/m11-m12-combined-integration "https://github.com/$GITHUB_REPOSITORY.git" source
          cd source
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e 6ead1d076946dd96b53401265a31efc35c4a666c^{commit}
          dotnet build HarborOps.sln -c Release -warnaserror
      - name: Execute migration, audit and scoped functional regressions
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p .verification
          dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj             --configuration Release --no-build --blame-hang-timeout 10m             --filter 'FullyQualifiedName~MigrationSnapshotTests|FullyQualifiedName~AuditMigrationTests|FullyQualifiedName~CombinedRetentionTests|FullyQualifiedName~M10ProjectorScopeUpgradeTests|FullyQualifiedName~M10UpgradeTests|FullyQualifiedName~ReferenceHistoricalUpgradeTests|FullyQualifiedName~M11ExceptionRuntimeTests|FullyQualifiedName~ShipmentSearchHttpTests|FullyQualifiedName~TrackingWorkerMigrationTests|FullyQualifiedName~AuditHardeningTests'             --logger 'console;verbosity=normal'             --logger 'trx;LogFileName=impacted.trx'             --results-directory .verification
      - name: Preserve source and result identity in job record
        if: always()
        working-directory: source
        run: |
          echo "Impacted regression source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if test -f .verification/impacted.trx; then sha256sum .verification/impacted.trx | tee -a "$GITHUB_STEP_SUMMARY"; fi
          echo "This is an impacted regression run, not G11/G12 gate acceptance." >> "$GITHUB_STEP_SUMMARY"
