  combined-regressions:
    name: G15 impacted historical migration and M11 regressions
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 130
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: harborops_integration
          POSTGRES_USER: harborops
          POSTGRES_PASSWORD: disposable-combined-regressions
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U harborops -d harborops_integration" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HARBOROPS_TEST_DB: "Host=127.0.0.1;Port=5432;Database=harborops_integration;Username=harborops;Password=disposable-combined-regressions;Pooling=false"
      HARBOROPS_G13_EXCLUSIVE_POSTGRES: '1'
      HARBOROPS_G12_EXCLUSIVE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify frozen source and execute Combined M10 M11 M12 and audit regressions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .verification/combined-regressions
          dotnet build HarborOps.sln -c Release -warnaserror 2>&1 | tee .verification/combined-regressions/build.log
          mkdir -p .verification/combined-regressions/g11 .verification/combined-regressions/g12
          export HARBOROPS_G11_EVIDENCE_DIR="$PWD/.verification/combined-regressions/g11"
          export HARBOROPS_G12_EVIDENCE_DIR="$PWD/.verification/combined-regressions/g12"
          dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj -c Release --no-build --filter 'FullyQualifiedName~M10RuntimeIdentityTests.StolenDatabaseSessionIdsCannotForgeAnM10Correction|FullyQualifiedName~M10RuntimeIdentityTests.M10HttpRoutesRunUnderTheRestrictedApiRoleWithManagerAndTenantGuards|FullyQualifiedName~M10RuntimeIdentityTests.LateWorkerEffectDuringRebuildIsNeverLostAndMarksTheProjectionStale' --logger 'console;verbosity=normal' --logger 'trx;LogFileName=m10-correction-regressions.trx' --results-directory .verification/combined-regressions 2>&1 | tee .verification/combined-regressions/m10-correction-regressions.log
          test -s .verification/combined-regressions/m10-correction-regressions.trx
          dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj -c Release --no-build --filter 'FullyQualifiedName~IdentityLifecycleTests|FullyQualifiedName~ShipmentBoundaryTests|FullyQualifiedName~M11ResidualRuntimeTests|FullyQualifiedName~M12ResidualBoundaryTests|FullyQualifiedName~AuditIntegrityTests|FullyQualifiedName~AuditHardeningTests' --logger 'console;verbosity=normal' --logger 'trx;LogFileName=combined-regressions.trx' --results-directory .verification/combined-regressions 2>&1 | tee .verification/combined-regressions/combined-regressions.log
          test -s .verification/combined-regressions/combined-regressions.trx
          dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj -c Release --no-build --filter 'FullyQualifiedName~TrackingInboxMigrationTests|FullyQualifiedName~AuditMigrationTests|FullyQualifiedName~ReferenceHistoricalUpgradeTests|FullyQualifiedName~CombinedRetentionTests|FullyQualifiedName~TrackingWorkerMigrationTests|FullyQualifiedName~M10ProjectorScopeUpgradeTests|FullyQualifiedName~TrackingInboxAuditSqlTests' --logger 'console;verbosity=normal' --logger 'trx;LogFileName=migrations.trx' --results-directory .verification/combined-regressions 2>&1 | tee .verification/combined-regressions/migrations.log
          test -s .verification/combined-regressions/migrations.trx
          # Run only the four M11 methods required by the G15 assertion inventory.
          # Their previous successes came from a different source revision.
          dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj -c Release --no-build --filter 'FullyQualifiedName~M11ExceptionRuntimeTests.RecurrenceAfterAcknowledgedClearanceCreatesNewOccurrence|FullyQualifiedName~M11ExceptionRuntimeTests.UnchangedReevaluationAdvancesCheckpointWithoutDuplicateHistory|FullyQualifiedName~M11ExceptionRuntimeTests.VerifiedClearancePersistsAcrossUnknownBeforeRecurrence|FullyQualifiedName~M11ExceptionRuntimeTests.NullSchedulesAreUnknownNotInventedDelays' --logger 'console;verbosity=normal' --logger 'trx;LogFileName=g15-m11-atomic-witnesses.trx' --results-directory .verification/combined-regressions 2>&1 | tee .verification/combined-regressions/g15-m11-atomic-witnesses.log
          test -s .verification/combined-regressions/g15-m11-atomic-witnesses.trx
      - name: Preserve combined-regressions evidence
        if: always()
        run: |
          mkdir -p .verification/combined-regressions
          printf '%s\n' "$GITHUB_SHA" > .verification/combined-regressions/source-sha.txt
          test -z "$(git status --porcelain --untracked-files=no)"
          (cd .verification/combined-regressions && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
      - name: Upload combined-regressions results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-regressions-${{ github.run_id }}
          path: .verification/combined-regressions/
          retention-days: 30
          include-hidden-files: true

  dependency-security:
    name: Dependency advisories and committed secret scan
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the exact source and dependency audit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .verification/dependency-security
          dotnet restore HarborOps.sln 2>&1 | tee .verification/dependency-security/restore.log
          dotnet list HarborOps.sln package --vulnerable --include-transitive 2>&1 | tee .verification/dependency-security/dotnet-advisories.txt
          npm --prefix web ci --ignore-scripts --no-audit --no-fund 2>&1 | tee .verification/dependency-security/npm-ci.log
          npm --prefix web audit --audit-level=high --json > .verification/dependency-security/npm-audit.json || true
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('.verification/dependency-security')
          data=json.loads((root/'npm-audit.json').read_text())
          counts=data.get('metadata',{}).get('vulnerabilities',{})
          high=int(counts.get('high',0)); critical=int(counts.get('critical',0))
          dn=(root/'dotnet-advisories.txt').read_text()
          bad_dotnet=bool(re.search(r'NU190[34]|\b(?:High|Critical)\b',dn,re.I))
          result={'npm_high':high,'npm_critical':critical,'dotnet_high_advisories':int(bad_dotnet),'scan_completed':not data.get('error') and not(high or critical or bad_dotnet)}
          (root/'summary.json').write_text(json.dumps(result,indent=2)+'\n')
          if not result['scan_completed']: raise SystemExit('Unresolved high-severity dependency evidence')
          PY
          if git grep -IlE 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----' -- ':!*.lock' > .verification/dependency-security/possible-secret-paths.txt; then echo "Potential committed credentials"; exit 1; fi
      - name: Seal dependency evidence
        if: always()
        run: |
          mkdir -p .verification/dependency-security
          printf '%s\n' "$GITHUB_SHA" > .verification/dependency-security/source-sha.txt
          (cd .verification/dependency-security && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-${{ github.run_id }}
          path: .verification/dependency-security/
          retention-days: 30
          include-hidden-files: true

  gate-ledger:
    name: Reconcile G15 S25 technical witnesses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [source, m15-database, m15-browser, scale, g15-fanout, g15-crashes, g15-mutations, combined-regressions, dependency-security]
    if: always()
    env:
      GATE_JOB_1: ${{ needs.source.result }}
      GATE_JOB_2: ${{ needs.m15-database.result }}
      GATE_JOB_3: ${{ needs.m15-browser.result }}
      GATE_JOB_4: ${{ needs.scale.result }}
      GATE_JOB_5: ${{ needs.g15-fanout.result }}
      GATE_JOB_6: ${{ needs.g15-crashes.result }}
      GATE_JOB_7: ${{ needs.g15-mutations.result }}
      GATE_JOB_8: ${{ needs.combined-regressions.result }}
      GATE_JOB_9: ${{ needs.dependency-security.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: .verification/gate-input
          pattern: '*'
          merge-multiple: false
      - name: Check complete source-bound S25 technical packet
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .verification/g15-s25-ledger
          python3 scripts/verify-g15-s25-remediation.py 2>&1 | tee .verification/g15-s25-ledger/verify.log
      - name: Seal evidence and record exact SHA
        if: always()
        run: |
          mkdir -p .verification/g15-s25-ledger
          printf '%s\n' "$GITHUB_SHA" > .verification/g15-s25-ledger/source-sha.txt
          (cd .verification/g15-s25-ledger && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
      - name: Upload G15 technical gate ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g15-s25-ledger-${{ github.run_id }}
          path: .verification/g15-s25-ledger/
          retention-days: 30
          include-hidden-files: true
