            --results-directory .verification/combined-regressions \
            2>&1 | tee .verification/combined-regressions/m10-correction-regressions.log
          dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj \
            -c Release --no-build \
            --filter 'FullyQualifiedName~IdentityLifecycleTests|FullyQualifiedName~ShipmentBoundaryTests|FullyQualifiedName~M11ResidualRuntimeTests|FullyQualifiedName~M12ResidualBoundaryTests|FullyQualifiedName~AuditIntegrityTests|FullyQualifiedName~AuditHardeningTests' \
            --logger 'console;verbosity=normal' \
            --logger 'trx;LogFileName=combined-regressions.trx' \
            --results-directory .verification/combined-regressions \
            2>&1 | tee .verification/combined-regressions/regressions.log
      - name: Seal regression evidence
        if: always()
