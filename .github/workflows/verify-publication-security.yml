name: Verify M11 M12 targeted audit cardinality
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA
        required: true
        type: string
      approval:
        description: Type RUN to approve the isolated verification
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: harborops-m11m12-n01
  cancel-in-progress: false

env:
  HARBOROPS_SOURCE_SHA: ${{ github.sha }}
  HARBOROPS_M11_ENABLE_EVALUATOR: "false"

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact branch and source
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          set -euo pipefail
          test "$APPROVAL" = RUN
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test -z "$(git diff --name-only 2eee441fa37c17101846516cf133a92c7e59335c HEAD -- src web contracts docker compose.yaml)"
          mkdir -p .verification
          printf '%s\n' "$EXPECTED_SHA" > .verification/source-sha.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source, archive index and mutation provenance
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/check-m11m12-stack.mjs
          node scripts/check-planning-docs.mjs
          node scripts/render-execution-graph.mjs --check
          node scripts/check-m11-contract.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const idx = JSON.parse(fs.readFileSync("docs/M11_M12_LOCAL_EVIDENCE_INDEX_20261108.json", "utf8"));
          assert.equal(idx.closurePackage.archive.path,
            "E:\\HarborOps-Verification\\archives\\m11m12-local-02-evidence-20261108.tar.gz");
          assert.equal(idx.closurePackage.mutationSourceProvenance.combinedValidKills, 17);
          const passes = idx.closurePackage.mutationSourceProvenance.passes;
          assert.deepEqual(passes.map(p => p.validKills), [10, 5, 2]);
          assert.deepEqual(passes.map(p => p.sourceSha.slice(0, 7)), ["ed58449", "6e90295", "6e90295"]);
          const ids = passes.flatMap(p => p.variantIds);
          assert.equal(ids.length, 17); assert.equal(new Set(ids).size, 17);
          assert.equal(JSON.stringify(idx).includes(String.fromCharCode(7)), false);
          const stack = fs.readFileSync("scripts/check-m11m12-stack.mjs", "utf8");
          assert.match(stack, /newN01Audits === 2/);
          assert.match(stack, /only.length === 1 && only\[0\] === "N01"/);
          console.log("Source lock, archive path and mutation pass attribution PASS");
          NODE
      - name: Provision disposable verification credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in HARBOROPS_DB_PASSWORD HARBOROPS_API_DB_PASSWORD HARBOROPS_WORKER_DB_PASSWORD HARBOROPS_TEST_USER_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
          for key in HARBOROPS_M10_CORRECTION_PROOF_KEY HARBOROPS_M12_EXPORT_PROOF_KEY; do
            value="$(openssl rand -base64 32 | tr -d '\n')"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
      - name: Build and start isolated Nginx API and PostgreSQL
        shell: bash
        env:
          HARBOROPS_SOURCE_SHA: ${{ github.sha }}
          HARBOROPS_M11_ENABLE_EVALUATOR: "false"
        run: |
          set -euo pipefail
          docker compose -f compose.m11m12.verify.yaml -p ho-verify-m11m12 up -d --build postgres migrator api web
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8091/health/ready >/dev/null 2>&1 &&
               curl -fsS http://127.0.0.1:5181/health/ready >/dev/null 2>&1; then
              echo "Isolated stack ready"; exit 0
            fi
            sleep 2
          done
          echo "Isolated stack readiness failed"; exit 1
      - name: Seed synthetic accounts and isolated fixture
        shell: bash
        run: |
          set -euo pipefail
          dc() { docker compose -f compose.m11m12.verify.yaml -p ho-verify-m11m12 "$@"; }
          db_before="$(docker inspect -f '{{.Id}}' ho-verify-m11m12-postgres-1)"
          api_before="$(docker inspect -f '{{.Id}}' ho-verify-m11m12-api-1)"
          for entry in "m12net-admin@example.test|M12 Net Administrator" "m12net-manager@example.test|M12 Net Manager" "m12net-analyst@example.test|M12 Net Analyst"; do
            printf '%s\n' "$HARBOROPS_TEST_USER_PASSWORD" | dc run --rm --no-deps -T -e HARBOROPS_ALLOW_ACCOUNT_CLI=true api --account-cli provision "${entry%%|*}" "${entry#*|}"
          done
          dc run --rm --no-deps -T -e HARBOROPS_ALLOW_ORGANIZATION_CLI=true api --organization-cli bootstrap m12-net "M12 Network Fixtures" m12net-admin@example.test
          test "$db_before" = "$(docker inspect -f '{{.Id}}' ho-verify-m11m12-postgres-1)"
          test "$api_before" = "$(docker inspect -f '{{.Id}}' ho-verify-m11m12-api-1)"
          curl -fsS http://127.0.0.1:8091/health/ready >/dev/null
          node scripts/check-m11m12-stack.mjs prepare .verification/n01-prepare.json
          node scripts/check-m11m12-stack.mjs load .verification/n01-load.json
      - name: Execute N01 twice to prove exact audit increments
        shell: bash
        env:
          M11M12_ONLY: N01
        run: |
          set -euo pipefail
          node scripts/check-m11m12-stack.mjs g12 .verification/n01-first.json
          node scripts/check-m11m12-stack.mjs g12 .verification/n01-repeat.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          for (const label of ["first", "repeat"]) {
            const j = JSON.parse(fs.readFileSync(".verification/n01-" + label + ".json", "utf8"));
            assert.equal(j.results.length, 5, "N01 only");
            assert.ok(j.results.every(x => x.id === "N01" && x.pass === true));
            const audit = j.results.find(x => x.name.includes("exactly two new preparation audits"));
            assert.ok(audit);
            assert.equal(audit.expected, "2");
            assert.equal(audit.actual, "2");
            console.log("N01 " + label + " PASS, exact audit delta 2");
          }
          NODE
          (cd .verification && sha256sum n01-*.json source-sha.txt > evidence.sha256)
      - name: Upload synthetic verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m11m12-n01-targeted
          path: |
            .verification/n01-prepare.json
            .verification/n01-load.json
            .verification/n01-first.json
            .verification/n01-repeat.json
            .verification/source-sha.txt
            .verification/evidence.sha256
          if-no-files-found: warn
          retention-days: 14
      - name: Remove disposable stack
        if: always()
        shell: bash
        run: |
          docker compose -f compose.m11m12.verify.yaml -p ho-verify-m11m12 down --volumes --remove-orphans || true
