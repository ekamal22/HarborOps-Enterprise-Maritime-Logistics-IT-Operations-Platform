name: Verify combined integration regressions
on:
  push:
    branches:
      - feat/m11-m12-combined-integration
    paths:
      - .github/workflows/verify-m11-m12-regressions.yml
jobs:
  integration:
    name: All PostgreSQL integration regressions
    runs-on: ubuntu-latest
    timeout-minutes: 105
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: harborops_integration
          POSTGRES_USER: harborops
          POSTGRES_PASSWORD: disposable-regression-only
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U harborops -d harborops_integration" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HARBOROPS_TEST_DB: "Host=127.0.0.1;Port=5432;Database=harborops_integration;Username=harborops;Password=disposable-regression-only;Pooling=false"
      HARBOROPS_G12_EXCLUSIVE_POSTGRES: "1"
    steps:
      - name: Checkout exact candidate on isolated host
        run: |
          set -euo pipefail
          git clone --branch feat/m11-m12-combined-integration "https://github.com/$GITHUB_REPOSITORY.git" source
          cd source
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e 6ead1d076946dd96b53401265a31efc35c4a666c^{commit}
          echo "Integrated regression SHA $GITHUB_SHA"
          echo "Independent exclusive PostgreSQL service: $(docker ps --filter ancestor=postgres:16.15 --format '{{.ID}}' | wc -l)"
          test "$(docker ps --filter ancestor=postgres:16.15 --format '{{.ID}}' | wc -l)" -eq 1
      - name: Build all projects with warnings as errors
        working-directory: source
        run: dotnet build HarborOps.sln -c Release -warnaserror
      - name: Execute entire .NET integration suite
        working-directory: source
        run: |
          set -euo pipefail
          dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj -c Release --no-build --blame-hang-timeout 10m --logger 'console;verbosity=normal' --logger 'trx;LogFileName=integration.trx' --results-directory .verification
      - name: Summarize exact run identity and retained evidence hash
        if: always()
        working-directory: source
        run: |
          echo "Integration source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if test -f .verification/integration.trx; then sha256sum .verification/integration.trx | tee -a "$GITHUB_STEP_SUMMARY"; fi
          echo "G11 and G12 gate acceptance remain independent." >> "$GITHUB_STEP_SUMMARY"
