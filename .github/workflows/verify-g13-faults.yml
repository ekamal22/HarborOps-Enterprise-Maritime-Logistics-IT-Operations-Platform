name: Verify G13 fault recovery
on:
  workflow_dispatch:
  push:
    branches:
      - plan/m13-operational-kpi-dashboards-20261108
    paths:
      - tests/HarborOps.IntegrationTests/M13FaultRecoveryTests.cs
      - .github/workflows/verify-g13-faults.yml
permissions:
  contents: read
concurrency:
  group: g13-faults-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  faults:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: harborops_integration
          POSTGRES_USER: harborops
          POSTGRES_PASSWORD: disposable-g13-fault
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U harborops -d harborops_integration" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HARBOROPS_TEST_DB: 'Host=127.0.0.1;Port=5432;Database=harborops_integration;Username=harborops;Password=disposable-g13-fault;Pooling=false'
      HARBOROPS_G13_EXCLUSIVE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and verify fault injection
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .verification/g13-faults
          dotnet build HarborOps.sln -c Release -warnaserror
          dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj             -c Release --no-build --filter 'FullyQualifiedName~M13FaultRecoveryTests'             --logger 'console;verbosity=normal' --logger 'trx;LogFileName=faults.trx'             --results-directory .verification/g13-faults
      - name: Preserve frozen source evidence
        if: always()
        run: |
          mkdir -p .verification/g13-faults
          printf '%s\n' "$GITHUB_SHA" > .verification/g13-faults/source-sha.txt
          sha256sum tests/HarborOps.IntegrationTests/M13FaultRecoveryTests.cs > .verification/g13-faults/test-sha256.txt
          find .verification/g13-faults -type f -print0 | sort -z | xargs -0 -r sha256sum >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g13-faults-${{ github.sha }}
          path: .verification/g13-faults
          if-no-files-found: warn
          retention-days: 14
