        with:
          name: g15-fanout-${{ github.run_id }}
          path: .verification/g15-fanout/
          retention-days: 30
          include-hidden-files: true

  g15-crashes:
    name: G15 process kill and recovery phases
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: harborops_integration
          POSTGRES_USER: harborops
          POSTGRES_PASSWORD: disposable-g15-crashes
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U harborops -d harborops_integration" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HARBOROPS_TEST_DB: "Host=127.0.0.1;Port=5432;Database=harborops_integration;Username=harborops;Password=disposable-g15-crashes;Pooling=false"
      HARBOROPS_G13_EXCLUSIVE_POSTGRES: '1'
      HARBOROPS_G13_G15_CRASH_PROBE: '1'
      HARBOROPS_CRASH_SCOPE: 'G15'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify frozen source and execute G15 process kill and recovery phases
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .verification/g15-crashes
          dotnet build HarborOps.sln -c Release -warnaserror 2>&1 | tee .verification/g15-crashes/build.log
          set +e
          python3 scripts/g13-g15-process-crash.py 2>&1 | tee .verification/g15-crashes/process-crash.log
          probe_code=${PIPESTATUS[0]}
          set -e
          # Keep phase logs even if a probe fails before emitting its marker.
          if [ -d .verification/g13-g15-crash ]; then
            cp -r .verification/g13-g15-crash/. .verification/g15-crashes/
          fi
          test -s .verification/g15-crashes/manifest.json
          exit "$probe_code"
      - name: Preserve g15-crashes evidence
        if: always()
        run: |
          mkdir -p .verification/g15-crashes
          printf '%s\n' "$GITHUB_SHA" > .verification/g15-crashes/source-sha.txt
          test -z "$(git status --porcelain --untracked-files=no)"
          (cd .verification/g15-crashes && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
      - name: Upload g15-crashes results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g15-crashes-${{ github.run_id }}
          path: .verification/g15-crashes/
          retention-days: 30
          include-hidden-files: true

  g15-mutations:
    name: G15 notification scope and delivery mutation sensitivity
    runs-on: ubuntu-latest
    timeout-minutes: 150
    needs: source
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: harborops_integration
          POSTGRES_USER: harborops
          POSTGRES_PASSWORD: disposable-g15-mutation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harborops -d harborops_integration"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HARBOROPS_TEST_DB: "Host=127.0.0.1;Port=5432;Database=harborops_integration;Username=harborops;Password=disposable-g15-mutation;Pooling=false"
      HARBOROPS_G13_EXCLUSIVE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify clean controls and all M15 mutants
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/g15-mutation-campaign.py
      - name: Seal original-source evidence
        if: always()
        run: |
          mkdir -p .verification/g15-mutations
          test -z "$(git status --porcelain --untracked-files=no)"
          printf '%s\n' "$GITHUB_SHA" > .verification/g15-mutations/source-sha.txt
          (cd .verification/g15-mutations && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g15-mutations-${{ github.run_id }}
          path: .verification/g15-mutations/
