name: Verify combined M11 M12 browser behavior
on:
  push:
    branches:
      - feat/m11-m12-combined-integration
    paths:
      - .github/workflows/verify-m11-m12-browser.yml
      - tests/browser/specs/shipment-exceptions.spec.mjs
      - tests/browser/specs/shipment-search.spec.mjs
      - tests/browser/specs/shipment.spec.mjs
      - tests/browser/specs/shipment-draft.spec.mjs
      - src/HarborOps.Infrastructure/Exceptions/**
      - src/HarborOps.Infrastructure/Persistence/Migrations/20261107180000_ShipmentExceptions.cs
      - web/src/shipments/**
      - src/HarborOps.Api/Exceptions/**
      - src/HarborOps.Api/Search/**

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Execute isolated browser campaign
        run: |
          set -euo pipefail
          git clone --branch feat/m11-m12-combined-integration "https://github.com/$GITHUB_REPOSITORY.git" source
          cd source
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          export HARBOROPS_SOURCE_SHA="$GITHUB_SHA"
          export HARBOROPS_DB_PASSWORD="$(openssl rand -hex 24)"
          export HARBOROPS_API_DB_PASSWORD="$(openssl rand -hex 24)"
          export HARBOROPS_WORKER_DB_PASSWORD="$(openssl rand -hex 24)"
          export HARBOROPS_M10_CORRECTION_PROOF_KEY="$(openssl rand -base64 32)"
          export HARBOROPS_M12_EXPORT_PROOF_KEY="$(openssl rand -base64 32)"
          export HARBOROPS_TEST_USER_PASSWORD="$(openssl rand -hex 22)"
          for key in HARBOROPS_DB_PASSWORD HARBOROPS_API_DB_PASSWORD HARBOROPS_WORKER_DB_PASSWORD HARBOROPS_M10_CORRECTION_PROOF_KEY HARBOROPS_M12_EXPORT_PROOF_KEY HARBOROPS_TEST_USER_PASSWORD; do
            echo "::add-mask::${!key}"
          done
          export HARBOROPS_BROWSER_BASE_URL=http://localhost:5173
          export HARBOROPS_M5_FIXTURES=1
          export HARBOROPS_M12_FIXTURES=1
          export HARBOROPS_VERIFICATION_ROOT="$PWD/.verification"
          mkdir -p .verification/evidence .verification/browser
          echo "$GITHUB_SHA" > .verification/browser/source-sha.txt
          project=ho-verify-m1112
          cleanup() {
            code=$?
            echo "Browser campaign source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            for f in .verification/browser/*.json; do
              if test -f "$f"; then
                sha256sum "$f" | tee -a "$GITHUB_STEP_SUMMARY"
              fi
            done
            docker compose --project-name "$project" ps || true
            docker compose --project-name "$project" down --volumes --remove-orphans || true
            exit "$code"
          }
          trap cleanup EXIT
          bash scripts/smoke-compose.sh --project "$project" --confirm-disposable
          for entry in             "m3-admin-a@example.test|M3 North Administrator"             "m3-admin-b@example.test|M3 East Administrator"             "m3-manager@example.test|M3 Manager"             "m3-analyst@example.test|M3 Analyst"             "m4-analyst-east@example.test|M4 East Analyst"             "m4-support@example.test|M4 Support"             "m4-auditor@example.test|M4 Auditor"; do
            email="${entry%%|*}"
            title="${entry#*|}"
            printf '%s\n' "$HARBOROPS_TEST_USER_PASSWORD" |
              docker compose -p "$project" run --rm -T -e HARBOROPS_ALLOW_ACCOUNT_CLI=true api                 --account-cli provision "$email" "$title"
          done
          for item in             "m3-north|M3 North Terminal|m3-admin-a@example.test"             "m3-east|M3 East Terminal|m3-admin-b@example.test"             "m3-pagination|M3 Pagination Fixtures|m3-admin-a@example.test"             "m3-revocation-chromium|M3 Revocation chromium|m3-admin-a@example.test"             "m3-revocation-firefox|M3 Revocation firefox|m3-admin-a@example.test"             "m3-revocation-webkit|M3 Revocation webkit|m3-admin-a@example.test"; do
            slug="${item%%|*}"
            rest="${item#*|}"
            title="${rest%%|*}"
            email="${rest#*|}"
            docker compose -p "$project" run --rm -T -e HARBOROPS_ALLOW_ORGANIZATION_CLI=true api               --organization-cli bootstrap "$slug" "$title" "$email"
          done
          node scripts/prepare-m3-browser-fixtures.mjs
          node scripts/prepare-m4-browser-fixtures.mjs
          node scripts/prepare-m5-browser-fixtures.mjs
          npm --prefix tests/browser ci --no-audit --no-fund
          cd tests/browser
          npx playwright install --with-deps chromium firefox webkit
          for engine in chromium firefox webkit; do
            for spec in shipment-exceptions shipment-search; do
              docker compose -p "$project" restart api
              ready=0
              for attempt in $(seq 1 45); do
                if curl --silent --fail --max-time 3 http://127.0.0.1:8080/health/ready >/dev/null; then ready=1; break; fi
                sleep 2
              done
              test "$ready" = "1"
              export HARBOROPS_G3_JSON_REPORT="$HARBOROPS_VERIFICATION_ROOT/browser/$engine-$spec.json"
              npx playwright test "specs/$spec.spec.mjs" --project="$engine" --workers=1
              node -e 'const r=require(process.env.HARBOROPS_G3_JSON_REPORT);const s=r.stats;if(!s||s.expected<1||s.skipped>0||s.unexpected>0)process.exit(2);console.log("Browser check "+s.expected+" executed, "+s.unexpected+" failed")'
            done
            for spec in shipment shipment-draft; do
              docker compose -p "$project" restart api
              ready=0
              for attempt in $(seq 1 45); do
                if curl --silent --fail --max-time 3 http://127.0.0.1:8080/health/ready >/dev/null; then ready=1; break; fi
                sleep 2
              done
              test "$ready" = "1"
              export HARBOROPS_G3_JSON_REPORT="$HARBOROPS_VERIFICATION_ROOT/browser/$engine-m5-$spec.json"
              npx playwright test "specs/$spec.spec.mjs"                 --grep 'M5 deferred shipment response cannot cross organization switch|M5 unsaved edits survive a background refresh'                 --project="$engine" --workers=1
              node -e 'const r=require(process.env.HARBOROPS_G3_JSON_REPORT);const s=r.stats;if(!s||s.expected<1||s.skipped>0||s.unexpected>0)process.exit(2);console.log("M5 regression "+s.expected+" executed, "+s.unexpected+" failed")'
            done
          done
