# Local, non-hosted verification on Windows hosts only. Windows bind mounts cannot
# be chowned to the rootless PostgreSQL and application UIDs, so the owned
# disposable project uses project-labelled named volumes instead. The runner
# creates and prepares them. Never combine with a retained project.
services:
  postgres:
    volumes: !override
      - pgdata:/var/lib/postgresql/data
  api:
    volumes: !override
      - keyring:/keys

volumes:
  pgdata:
    external: true
    name: ${HARBOROPS_G17_PROJECT:?Set the disposable project name}_pgdata
  keyring:
    external: true
    name: ${HARBOROPS_G17_PROJECT:?Set the disposable project name}_keyring
