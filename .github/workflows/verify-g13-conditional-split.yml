name: Verify G13 isolated integration
on:
  push:
    branches: [integration/g13-conditional-20261112]
    paths: [.github/workflows/verify-g13-conditional-split.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    name: G13 source unit contract and web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated source
        run: |
          set -euo pipefail
          mkdir -p .verification/g13-source
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -f src/HarborOps.Infrastructure/Persistence/Migrations/20261109010000_M15ScopedNotifications.cs
          test ! -f src/HarborOps.Infrastructure/Notifications/NotificationStore.cs
          ! grep -q 'MapNotificationEndpoints' src/HarborOps.Api/Program.cs
          ! grep -q 'M15__EnableDelivery' compose.yaml
          git rev-parse HEAD > .verification/g13-source/source-sha.txt
          node scripts/check-m13-csp.mjs 2>&1 | tee .verification/g13-source/csp.log
      - name: Build and test source
        run: |
          set -euo pipefail
          dotnet restore HarborOps.sln 2>&1 | tee .verification/g13-source/restore.log
          dotnet build HarborOps.sln -c Release --no-restore -warnaserror 2>&1 | tee .verification/g13-source/build.log
          dotnet test tests/HarborOps.UnitTests/HarborOps.UnitTests.csproj -c Release --no-build --logger 'trx;LogFileName=unit.trx' --results-directory .verification/g13-source 2>&1 | tee .verification/g13-source/unit.log
          dotnet test tests/HarborOps.ContractTests/HarborOps.ContractTests.csproj -c Release --no-build --logger 'trx;LogFileName=contract.trx' --results-directory .verification/g13-source 2>&1 | tee .verification/g13-source/contract.log
      - name: Web tests and build
        run: |
          set -euo pipefail
          npm --prefix web ci --no-audit --no-fund 2>&1 | tee .verification/g13-source/npm.log
          npm --prefix web test 2>&1 | tee .verification/g13-source/web-test.log
          npm --prefix web run build 2>&1 | tee .verification/g13-source/web-build.log
      - name: Seal and upload source evidence
        if: always()
        run: |
          git rev-parse HEAD > .verification/g13-source/final-sha.txt
          (cd .verification/g13-source && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g13-split-source-${{ github.run_id }}
          path: .verification/g13-source/
          retention-days: 30
          include-hidden-files: true
  database:
    name: G13 restricted database and migration regression
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 110
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: harborops_integration
          POSTGRES_USER: harborops
          POSTGRES_PASSWORD: disposable-g13-isolated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harborops -d harborops_integration"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HARBOROPS_TEST_DB: "Host=127.0.0.1;Port=5432;Database=harborops_integration;Username=harborops;Password=disposable-g13-isolated;Pooling=false"
      HARBOROPS_G13_EXCLUSIVE_POSTGRES: "1"
      HARBOROPS_G12_EXCLUSIVE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify and build exact SHA
        run: |
          set -euo pipefail
          mkdir -p .verification/g13-db
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > .verification/g13-db/source-sha.txt
          dotnet restore HarborOps.sln 2>&1 | tee .verification/g13-db/restore.log
          dotnet build HarborOps.sln -c Release --no-restore -warnaserror 2>&1 | tee .verification/g13-db/build.log
      - name: Run ordered G13-only tests
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r label filter; do
            test -n "$label" || continue
            dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj -c Release --no-build --filter "$filter" --logger 'console;verbosity=normal' --logger "trx;LogFileName=$label.trx" --results-directory .verification/g13-db 2>&1 | tee ".verification/g13-db/$label.log"
            test -s ".verification/g13-db/$label.trx"
          done <<'FILTERS'
          migration-baseline	FullyQualifiedName~MigrationSnapshotTests|FullyQualifiedName~AuditMigrationTests|FullyQualifiedName~M11M12UpgradeTests
          migration-compat	FullyQualifiedName~M10UpgradeTests|FullyQualifiedName~M10ProjectorScopeUpgradeTests|FullyQualifiedName~ReferenceHistoricalUpgradeTests
          g13-functional	FullyQualifiedName~M13OperationalKpiRuntimeTests|FullyQualifiedName~G13FilterAcceptanceTests|FullyQualifiedName~G13TrackingSourceAcceptanceTests|FullyQualifiedName~G13M11SourceAcceptanceTests
          g13-security	FullyQualifiedName~M13SecurityEnvelopeAcceptanceTests|FullyQualifiedName~G13RateLimitAcceptanceTests
          g13-capacity	FullyQualifiedName~M13TenantCapacityAcceptanceTests|FullyQualifiedName~M13AdmissionControlAcceptanceTests|FullyQualifiedName~M13FaultRecoveryTests
          FILTERS
      - name: Seal database evidence
        if: always()
        run: |
          mkdir -p .verification/g13-db
          git rev-parse HEAD > .verification/g13-db/final-sha.txt
          (cd .verification/g13-db && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g13-split-database-${{ github.run_id }}
          path: .verification/g13-db/
          retention-days: 30
          include-hidden-files: true
