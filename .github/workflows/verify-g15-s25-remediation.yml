    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: harborops_integration
          POSTGRES_USER: harborops
          POSTGRES_PASSWORD: disposable-g15-fanout
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U harborops -d harborops_integration" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HARBOROPS_TEST_DB: "Host=127.0.0.1;Port=5432;Database=harborops_integration;Username=harborops;Password=disposable-g15-fanout;Pooling=false"
      HARBOROPS_G13_EXCLUSIVE_POSTGRES: '1'
      HARBOROPS_G15_EXCLUSIVE_FANOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify frozen source and execute G15 dispatcher fanout and concurrent readers
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .verification/g15-fanout
          dotnet build HarborOps.sln -c Release -warnaserror 2>&1 | tee .verification/g15-fanout/build.log
          dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj -c Release --no-build --filter 'FullyQualifiedName~M15FanoutLoadTests' --logger 'console;verbosity=normal' --logger 'trx;LogFileName=fanout.trx' --results-directory .verification/g15-fanout 2>&1 | tee .verification/g15-fanout/fanout.log
          test -s .verification/g15-fanout/fanout.trx
      - name: Preserve g15-fanout evidence
        if: always()
        run: |
          mkdir -p .verification/g15-fanout
          printf '%s\n' "$GITHUB_SHA" > .verification/g15-fanout/source-sha.txt
          test -z "$(git status --porcelain --untracked-files=no)"
          (cd .verification/g15-fanout && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
      - name: Upload g15-fanout results
        if: always()
