      - uses: actions/download-artifact@v4
        with:
          path: .verification/gate-input
          pattern: '*'
          merge-multiple: false
      - name: Source-locked technical evidence reconciliation
        run: |
          set -uo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || exit 3
          mkdir -p .verification/gate-ledger
          set +e
          python3 scripts/verify-g13-g15-evidence.py > .verification/gate-ledger/verify.log 2>&1; verify=$?
          python3 scripts/check-g13-g15-scenarios.py > .verification/gate-ledger/scenarios.log 2>&1; scenarios=$?
          python3 scripts/audit-g13-g15-assertions.py --enforce-complete > .verification/gate-ledger/assertions.log 2>&1; assertions=$?
          python3 scripts/check-g13-g15-sensitive-evidence.py > .verification/gate-ledger/sensitive.log 2>&1; sensitive=$?
          printf 'verify=%s\nscenarios=%s\nassertions=%s\nsensitive=%s\n' "$verify" "$scenarios" "$assertions" "$sensitive" > .verification/gate-ledger/exit-codes.txt
          printf '%s\n' "$GITHUB_SHA" > .verification/gate-ledger/source-sha.txt
          (cd .verification/gate-ledger && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
          if [ "$sensitive" -eq 0 ]; then
            tar -czf .verification/g13-g15-evidence-packet.tgz -C .verification gate-input gate-ledger
          else
            echo "Sensitive evidence scan failed; no combined archive is published"
          fi
          cat .verification/gate-ledger/exit-codes.txt
          [ "$verify" -eq 0 ] && [ "$scenarios" -eq 0 ] && [ "$assertions" -eq 0 ] && [ "$sensitive" -eq 0 ]
      - name: Upload technical ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-g15-evidence-${{ github.run_id }}
          path: .verification/gate-ledger/
          retention-days: 30
          include-hidden-files: true
      - name: Upload combined packet when safe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-g15-packet-${{ github.run_id }}
          path: .verification/g13-g15-evidence-packet.tgz
          if-no-files-found: ignore
          retention-days: 30
