  dependency-security:
    name: Dependency advisories and committed secret scan
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the exact source and dependency audit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .verification/dependency-security
          dotnet restore HarborOps.sln 2>&1 | tee .verification/dependency-security/restore.log
          dotnet list HarborOps.sln package --vulnerable --include-transitive 2>&1 | tee .verification/dependency-security/dotnet-advisories.txt
          npm --prefix web ci --ignore-scripts --no-audit --no-fund 2>&1 | tee .verification/dependency-security/npm-ci.log
          npm --prefix web audit --audit-level=high --json > .verification/dependency-security/npm-audit.json || true
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('.verification/dependency-security')
          data=json.loads((root/'npm-audit.json').read_text())
          counts=data.get('metadata',{}).get('vulnerabilities',{})
          high=int(counts.get('high',0)); critical=int(counts.get('critical',0))
          dn=(root/'dotnet-advisories.txt').read_text()
          bad_dotnet=bool(re.search(r'NU190[34]|\b(?:High|Critical)\b',dn,re.I))
          result={'npm_high':high,'npm_critical':critical,'dotnet_high_advisories':int(bad_dotnet),'scan_completed':not data.get('error') and not(high or critical or bad_dotnet)}
          (root/'summary.json').write_text(json.dumps(result,indent=2)+'\n')
          if not result['scan_completed']: raise SystemExit('Unresolved high-severity dependency evidence')
          PY
          if git grep -IlE 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----' -- ':!*.lock' > .verification/dependency-security/possible-secret-paths.txt; then echo "Potential committed credentials"; exit 1; fi
      - name: Seal dependency evidence
        if: always()
        run: |
          mkdir -p .verification/dependency-security
          printf '%s\n' "$GITHUB_SHA" > .verification/dependency-security/source-sha.txt
          (cd .verification/dependency-security && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-${{ github.run_id }}
          path: .verification/dependency-security/
          retention-days: 30
          include-hidden-files: true

