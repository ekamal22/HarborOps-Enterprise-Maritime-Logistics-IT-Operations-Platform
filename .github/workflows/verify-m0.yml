name: Verify M0

# Manual only to avoid consuming private-repository minutes unexpectedly.
on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      HARBOROPS_TEST_DB: "Host=127.0.0.1;Port=5432;Database=harborops_integration;Username=harborops"
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root PostgreSQL test image
        run: docker build -f docker/postgres/Dockerfile -t harborops-postgres:16.15-rootless .
      - name: Start disposable local PostgreSQL
        run: |
          docker run -d --name harborops-test-pg \
            --tmpfs /var/lib/postgresql/data:uid=70,gid=70,mode=0700 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e POSTGRES_DB=harborops_integration \
            -e POSTGRES_USER=harborops \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:5432:5432 \
            harborops-postgres:16.15-rootless
          for attempt in $(seq 1 30); do
            if docker exec harborops-test-pg pg_isready -U harborops -d harborops_integration; then
              docker exec harborops-test-pg sh -ec 'test "$(id -u)" = "70"; test ! -e /usr/local/bin/gosu; test ! -e /usr/local/bin/su-exec'
              exit 0
            fi
            sleep 2
          done
          docker logs harborops-test-pg
          exit 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore
        run: dotnet restore HarborOps.sln
      - name: Build
        run: dotnet build HarborOps.sln --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test tests/HarborOps.UnitTests/HarborOps.UnitTests.csproj --configuration Release --no-build
      - name: Contract tests
        run: dotnet test tests/HarborOps.ContractTests/HarborOps.ContractTests.csproj --configuration Release --no-build
      - name: PostgreSQL integration tests
        run: dotnet test tests/HarborOps.IntegrationTests/HarborOps.IntegrationTests.csproj --configuration Release --no-build
      - name: Web tests and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Validate Compose configuration
        env:
          HARBOROPS_DB_PASSWORD: "workflow-only-validation-value"
        run: docker compose config --quiet
