          sha256sum scripts/g13-security-mutation-campaign.py > .verification/g13-security-mutations/runner-sha256.txt
          printf '%s\n' "$GITHUB_SHA" > .verification/g13-security-mutations/source-sha.txt
          (cd .verification/g13-security-mutations && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt)
          find .verification/g13-security-mutations -type f -print0 | sort -z | xargs -0 -r sha256sum >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g13-security-mutations-${{ github.sha }}
          path: .verification/g13-security-mutations
          retention-days: 14


