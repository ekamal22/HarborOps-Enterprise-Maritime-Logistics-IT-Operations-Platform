receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512
  attributes/sanitize:
    actions:
      - {key: http.request.header.cookie, action: delete}
      - {key: http.request.header.authorization, action: delete}
      - {key: url.full, action: delete}
      - {key: db.statement, action: delete}
      - {key: db.query.text, action: delete}
      - {key: exception.message, action: delete}
      - {key: exception.stacktrace, action: delete}
exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: false
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/sanitize, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/sanitize, batch]
      exporters: [prometheus]
